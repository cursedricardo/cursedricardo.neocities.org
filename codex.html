<!DOCTYPE html>
<html>
<head>
  <title>CODEX</title>
  <script src="codex.js" defer></script> 
  <link id="stylesheet" rel="stylesheet" href="/codex.css">
  <link rel="icon" type="image/x-icon" href="/images/blue.ico">
</head>
<body>
  <div class="crt-wrapper">
   <div class="content"> 
    <div class="heading"><p>-CODEX-</p>
         <p>PASSWORD</p></div>

         <a class="back" href="index.html"><--</a>

      <div class="password-box" id="passwordDisplay">
        <div class="digit" id="digit1"></div>
        <div class="digit" id="digit2"></div>
        <div class="digit" id="digit3"></div>
        <div class="digit" id="digit4"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key special" id="btn-del" data-action="del">DEL</button>
        <button class="key" data-value="0" id="btn-0">0</button>
        <button class="key special" id="btn-enter" data-action="enter">ENT</button>
      </div>
          <div id="door" class="door">
        <img id="doorImage" src="images/door-closed.png"/>
      </div>
      <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
   </div>
  </div>
</body>
</html>
